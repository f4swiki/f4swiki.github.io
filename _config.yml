title: F4S Wiki
description: Wiki for Freedom for Students
theme: just-the-docs

url: https://f4swiki.github.io
nav_enabled: true
color_scheme: dark

callouts_level: loud # or quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Copyright 2025-2026 Call of Freedom (CoF) known as Freedom for Students (F4S)'

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"